<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshi-Job-Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-rose-100 selection:text-rose-600">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      
      <div class="flex items-center gap-2.5">
        <div class="bg-gradient-to-tr from-rose-500 to-indigo-600 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid font-bold text-base sm:text-lg fa-compass"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg leading-tight tracking-tight text-slate-900">Yoshi-Job-Finder</h1>
          <p class="text-[10px] sm:text-xs text-slate-500 hidden sm:block">美さんのやりたいことを見つける転職サポート</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        
        <button onclick="openModal('sheet-modal')" class="text-xs px-2.5 py-1.5 rounded-lg border flex items-center gap-1.5 transition bg-slate-50 hover:bg-slate-100 border-slate-300 text-slate-700">
          <span id="sheet-status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
          <span class="hidden md:inline font-medium text-[11px]">スプレッドシート連携</span>
        </button>

        <button onclick="openModal('reason-manage-modal')" class="text-xs p-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition" title="プルダウン理由の編集">
          <i class="fa-solid fa-sliders"></i>
          <span class="hidden lg:inline text-[11px] ml-1">理由の選択肢設定</span>
        </button>

        <button onclick="openModal('add-modal')" class="bg-slate-900 hover:bg-black text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 求人を追加
        </button>

        <div class="border-l border-slate-200 pl-3 ml-1 flex items-center shrink-0">
          <img src="ロゴ.jpg" alt="CHIRO Vision & Style" class="h-10 w-auto object-contain">
        </div>

      </div>
    </div>

    <div class="border-t border-slate-100 bg-slate-50/80 px-3 sm:px-6 overflow-x-auto custom-scrollbar">
      <nav class="flex gap-2 py-2 text-xs font-medium min-w-max">
        <button id="tab-focus" onclick="switchView('focus')" class="px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-rose-50 text-rose-600 border border-rose-200 font-bold shadow-sm">
          <i class="fa-solid fa-clone"></i> 1件ずつ集中レビュー
        </button>
        <button id="tab-list" onclick="switchView('list')" class="px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-200/60">
          <i class="fa-solid fa-list-ul"></i> 求人一覧・比較
        </button>
        <button id="tab-insights" onclick="switchView('insights')" class="px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-200/60">
          <i class="fa-solid fa-lightbulb"></i> 発見した軸・分析
        </button>
      </nav>
    </div>
  </header>

  <div id="sync-toast" class="fixed bottom-4 right-4 z-50 bg-slate-900 text-white text-xs px-3.5 py-2 rounded-xl shadow-lg flex items-center gap-2 transition-all opacity-0 translate-y-2 pointer-events-none">
    <i id="sync-toast-icon" class="fa-solid fa-spinner fa-spin text-rose-400"></i>
    <span id="sync-toast-msg">同期中...</span>
  </div>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8">

    <section id="view-focus" class="block">
      <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5">

        <div class="lg:col-span-12 flex justify-between items-center bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-slate-500">進捗:</span>
            <span id="review-progress-text" class="text-xs sm:text-sm font-bold text-slate-800">1 / 1 件の求人</span>
          </div>
          <div class="flex gap-2">
            <button onclick="navigateJob(-1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50 text-slate-700 text-xs flex items-center gap-1 font-medium">
              <i class="fa-solid fa-chevron-left"></i> 前へ
            </button>
            <button onclick="navigateJob(1)" class="px-3 py-1.5 border rounded-lg hover:bg-slate-50 text-slate-700 text-xs flex items-center gap-1 font-medium">
              次へ <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="lg:col-span-7 space-y-4">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-r from-slate-900 to-slate-800 p-5 text-white">
              <div class="flex justify-between items-start gap-3">
                <div class="min-w-0 flex-1">
                  <span id="focus-industry" class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-700 text-slate-200 mb-1">業種</span>
                  <h2 id="focus-title" class="text-base sm:text-lg font-bold leading-snug break-words">求人タイトル</h2>
                  <p id="focus-company" class="text-slate-300 font-medium text-xs sm:text-sm mt-1 truncate">会社名</p>
                </div>
                <a id="focus-url" href="#" target="_blank" class="shrink-0 bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-xl border border-white/20 transition text-sm" title="求人元サイトを見る">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
              </div>

              <div id="focus-tags" class="flex flex-wrap gap-1.5 mt-3"></div>
            </div>

            <div class="p-5 space-y-4 custom-scrollbar max-h-[480px] overflow-y-auto">
              <div>
                <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-briefcase text-slate-500"></i> 仕事内容</h4>
                <p id="focus-description" class="text-xs sm:text-sm text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 whitespace-pre-wrap break-words"></p>
              </div>

              <div>
                <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-user-check text-slate-500"></i> 対象（応募条件）</h4>
                <p id="focus-requirements" class="text-xs sm:text-sm text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 whitespace-pre-wrap break-words"></p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                <div>
                  <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-yen-sign text-slate-500"></i> 給与</h4>
                  <p id="focus-salary" class="text-xs sm:text-sm font-semibold text-slate-800 break-words"></p>
                </div>
                <div>
                  <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-location-dot text-slate-500"></i> 勤務地・最寄り駅</h4>
                  <p id="focus-location" class="text-xs sm:text-sm text-slate-700 break-words"></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="lg:col-span-5 space-y-4">
          <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex items-center justify-between border-b pb-2.5">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-full bg-rose-100 text-rose-600 font-bold flex items-center justify-center text-xs shrink-0">美</span>
                <h3 class="font-bold text-xs sm:text-sm text-slate-800">美さんの評価＆感想</h3>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1.5">1. 直感評価</label>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="setRating('◎')" id="rate-double-circle" class="rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-slate-200 hover:border-emerald-400 transition bg-white">
                  <span class="text-xl font-bold text-emerald-600">◎</span>
                  <span class="text-[10px] text-slate-500 font-medium">すごく良い</span>
                </button>
                <button type="button" onclick="setRating('◯')" id="rate-circle" class="rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-slate-200 hover:border-blue-400 transition bg-white">
                  <span class="text-xl font-bold text-blue-600">◯</span>
                  <span class="text-[10px] text-slate-500 font-medium">アリかも</span>
                </button>
                <button type="button" onclick="setRating('×')" id="rate-cross" class="rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-slate-200 hover:border-rose-400 transition bg-white">
                  <span class="text-xl font-bold text-rose-500">×</span>
                  <span class="text-[10px] text-slate-500 font-medium">イマイチ</span>
                </button>
              </div>
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-xs font-semibold text-slate-700">2. 合わない・引っかかる理由</label>
                <button type="button" onclick="openModal('reason-manage-modal')" class="text-[10px] text-indigo-600 hover:underline">編集</button>
              </div>
              <select id="focus-mismatch-reason" onchange="updateJobData()" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-rose-400 focus:outline-none text-slate-700">
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-800 mb-1">3. 美さんの自由コメント</label>
              <textarea id="focus-mi-comment" oninput="handleTypingUpdate()" rows="4" placeholder="・惹かれたポイント&#10;・気になった点や懸念など自由に書こう！" class="w-full text-xs p-3 bg-rose-50/30 border border-rose-200 rounded-lg focus:ring-2 focus:ring-rose-400 focus:outline-none leading-relaxed text-slate-800"></textarea>
            </div>
          </div>

          <div class="bg-indigo-50/60 p-4 sm:p-5 rounded-2xl border border-indigo-100 space-y-3">
            <div class="flex items-center gap-2 border-b border-indigo-100 pb-2">
              <span class="w-7 h-7 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-xs shrink-0">洋</span>
              <h3 class="font-bold text-indigo-950 text-xs sm:text-sm">洋さんのサポートコメント</h3>
            </div>
            <textarea id="focus-yo-comment" oninput="handleTypingUpdate()" rows="3" placeholder="アドバイスや感想を入力..." class="w-full text-xs p-3 bg-white border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none leading-relaxed text-slate-800"></textarea>
          </div>
        </div>

      </div>
    </section>

    <section id="view-list" class="hidden space-y-4">
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-3 shadow-sm">
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
          <div>
            <select id="filter-rating" onchange="renderJobList()" class="text-xs p-2 border rounded-lg">
              <option value="ALL">すべて表示</option>
              <option value="◎">◎ だけ</option>
              <option value="◯">◯ だけ</option>
              <option value="×">× だけ</option>
              <option value="UNREVIEWED">未レビュー</option>
            </select>
          </div>
          <input type="text" id="filter-keyword" oninput="renderJobList()" placeholder="検索..." class="text-xs p-2 border rounded-lg w-40">
        </div>
        <span id="job-count-badge" class="text-xs font-semibold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full">0 件</span>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b text-slate-600 font-bold">
              <th class="p-3 w-16 text-center">評価</th>
              <th class="p-3">会社名 / 求人タイトル</th>
              <th class="p-3">合わない理由</th>
              <th class="p-3">美コメント</th>
              <th class="p-3">洋コメント</th>
              <th class="p-3 w-20 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="job-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <section id="view-insights" class="hidden space-y-5">
      <div class="bg-gradient-to-r from-rose-500 to-indigo-600 rounded-2xl p-5 text-white shadow-md">
        <h2 class="text-base font-bold flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 美さんの「やりたいこと・価値観」発見ノート
        </h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-xs text-emerald-700 border-b pb-2">高評価（◎/◯）求人・魅力</h3>
          <ul id="insight-likes-list" class="space-y-2 text-xs text-slate-700"></ul>
        </div>

        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-xs text-rose-700 border-b pb-2">引っかかる理由の傾向</h3>
          <div id="insight-dislikes-chart" class="space-y-2"></div>
        </div>
      </div>
    </section>

  </main>

  <div id="reason-manage-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl space-y-4">
      <h3 class="font-bold text-sm">プルダウン理由の編集</h3>
      <div class="flex gap-2">
        <input type="text" id="new-reason-input" placeholder="理由を入力" class="flex-1 text-xs p-2 border rounded-lg">
        <button type="button" onclick="addReasonOption()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg">追加</button>
      </div>
      <div class="space-y-2 max-h-60 overflow-y-auto border-t border-b py-3" id="reason-list-container"></div>
      <button type="button" onclick="closeModal('reason-manage-modal')" class="w-full py-2 bg-slate-800 text-white text-xs rounded-lg">完了</button>
    </div>
  </div>

  <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl space-y-3 max-h-[90vh] overflow-y-auto custom-scrollbar">
      <h3 class="font-bold text-sm">新規求人の追加</h3>
      <form id="add-job-form" onsubmit="handleAddJob(event)" class="space-y-3 text-xs">
        <input type="text" id="new-company" placeholder="会社名 *" required class="w-full p-2 border rounded-lg">
        <input type="text" id="new-title" placeholder="求人タイトル *" required class="w-full p-2 border rounded-lg">
        <input type="url" id="new-url" placeholder="求人URL" class="w-full p-2 border rounded-lg">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="new-industry" placeholder="業種" class="p-2 border rounded-lg">
          <input type="text" id="new-salary" placeholder="給与" class="p-2 border rounded-lg">
        </div>
        <input type="text" id="new-location" placeholder="勤務地・最寄り駅" class="w-full p-2 border rounded-lg">
        <textarea id="new-description" placeholder="仕事内容" class="w-full p-2 border rounded-lg"></textarea>
        <textarea id="new-requirements" placeholder="対象（応募条件）" class="w-full p-2 border rounded-lg"></textarea>
        <input type="text" id="new-tags" placeholder="タグ（カンマ区切り）" class="w-full p-2 border rounded-lg">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('add-modal')" class="px-3 py-1.5 text-slate-600">キャンセル</button>
          <button type="submit" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg">登録</button>
        </div>
      </form>
    </div>
  </div>

  <div id="sheet-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl space-y-4 text-xs">
      <h3 class="font-bold text-sm">スプレッドシート連携設定</h3>
      <input type="url" id="sheet-api-url" placeholder="GAS Web App URL..." class="w-full p-2.5 border rounded-lg">
      <div class="flex gap-2">
        <button type="button" onclick="saveSheetUrl()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg font-semibold">連携</button>
        <button type="button" onclick="fetchFromSheet()" class="bg-slate-100 py-2 px-3 rounded-lg">読み込み</button>
      </div>
    </div>
  </div>

  <script>
    let reasonOptions = ["勤務地・リモート可否", "給与・待遇", "仕事内容・職種", "応募条件・スキル壁", "社風・環境", "労働時間・残業", "その他"];
    let jobs = [
      {
        id: 1,
        date: "2026-09-01",
        company: "サンプルテクノロジー",
        title: "Webディレクター / 企画アシスタント",
        url: "https://example.com",
        description: "自社Webサービスの企画・運営業務。",
        requirements: "基本操作ができる方",
        location: "東京都渋谷区",
        salary: "年収 400万〜500万",
        industry: "IT・Web",
        tags: ["リモート可", "土日祝休み"],
        miRating: "◎",
        mismatchReason: "",
        miComment: "企画の部分にすごくワクワクした！",
        yoComment: "これまでの経験がすごく活かせそう！"
      }
    ];

    let currentJobIndex = 0;
    let sheetApiUrl = "";
    let typingTimer = null;

    window.onload = function() {
      loadSavedData();
      renderReasonDropdownOptions();
      renderReasonManagementList();
      renderFocusView();
      renderJobList();
      renderInsights();
      checkSheetStatus();
    };

    function loadSavedData() {
      const savedJobs = localStorage.getItem('yjf_jobs');
      if (savedJobs) { try { jobs = JSON.parse(savedJobs); } catch(e){} }
      const savedReasons = localStorage.getItem('yjf_reasons');
      if (savedReasons) { try { reasonOptions = JSON.parse(savedReasons); } catch(e){} }
      const savedUrl = localStorage.getItem('yjf_sheet_url');
      if (savedUrl) {
        sheetApiUrl = savedUrl;
        document.getElementById('sheet-api-url').value = savedUrl;
      }
    }

    function saveDataLocally() {
      localStorage.setItem('yjf_jobs', JSON.stringify(jobs));
      localStorage.setItem('yjf_reasons', JSON.stringify(reasonOptions));
      syncToSpreadsheetDebounced();
    }

    function handleTypingUpdate() {
      updateJobData();
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        saveDataLocally();
      }, 800);
    }

    function renderReasonDropdownOptions() {
      const select = document.getElementById('focus-mismatch-reason');
      const val = select.value;
      select.innerHTML = `<option value="">（選択なし）</option>` + reasonOptions.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
      select.value = val;
    }

    function renderReasonManagementList() {
      document.getElementById('reason-list-container').innerHTML = reasonOptions.map((opt, idx) => `
        <div class="flex items-center justify-between bg-slate-50 p-2 rounded text-xs border">
          <span>${escapeHtml(opt)}</span>
          <button type="button" onclick="removeReasonOption(${idx})" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
    }

    function addReasonOption() {
      const input = document.getElementById('new-reason-input');
      if (input.value.trim()) {
        reasonOptions.push(input.value.trim());
        input.value = '';
        saveDataLocally();
        renderReasonDropdownOptions();
        renderReasonManagementList();
      }
    }

    function removeReasonOption(idx) {
      reasonOptions.splice(idx, 1);
      saveDataLocally();
      renderReasonDropdownOptions();
      renderReasonManagementList();
    }

    function switchView(viewName) {
      ['focus', 'list', 'insights'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
        document.getElementById(`tab-${v}`).className = "px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-slate-600 hover:bg-slate-200/60";
      });
      document.getElementById(`view-${viewName}`).classList.remove('hidden');
      document.getElementById(`tab-${viewName}`).className = "px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 bg-rose-50 text-rose-600 border border-rose-200 font-bold shadow-sm";

      if (viewName === 'focus') renderFocusView();
      if (viewName === 'list') renderJobList();
      if (viewName === 'insights') renderInsights();
    }

    function renderFocusView() {
      if (jobs.length === 0) return;
      const job = jobs[currentJobIndex];
      document.getElementById('review-progress-text').innerText = `${currentJobIndex + 1} / ${jobs.length} 件の求人`;
      document.getElementById('focus-title').innerText = job.title;
      document.getElementById('focus-company').innerText = job.company;
      document.getElementById('focus-industry').innerText = job.industry || "未設定";
      document.getElementById('focus-url').href = job.url || "#";
      document.getElementById('focus-description').innerText = job.description || "";
      document.getElementById('focus-requirements').innerText = job.requirements || "";
      document.getElementById('focus-salary').innerText = job.salary || "";
      document.getElementById('focus-location').innerText = job.location || "";
      document.getElementById('focus-tags').innerHTML = (job.tags || []).map(t => `<span class="text-[10px] bg-white/10 px-2 py-0.5 rounded">${escapeHtml(t)}</span>`).join('');

      highlightRatingBtn(job.miRating);
      document.getElementById('focus-mismatch-reason').value = job.mismatchReason || "";
      document.getElementById('focus-mi-comment').value = job.miComment || "";
      document.getElementById('focus-yo-comment').value = job.yoComment || "";
    }

    function highlightRatingBtn(rating) {
      ['double-circle', 'circle', 'cross'].forEach(r => {
        document.getElementById(`rate-${r}`).className = "rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-slate-200 hover:border-slate-300 transition bg-white";
      });
      if (rating === '◎') document.getElementById('rate-double-circle').className = "rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-emerald-500 bg-emerald-50 text-emerald-700 font-bold";
      if (rating === '◯') document.getElementById('rate-circle').className = "rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-blue-500 bg-blue-50 text-blue-700 font-bold";
      if (rating === '×') document.getElementById('rate-cross').className = "rate-btn flex flex-col items-center justify-center py-2 border-2 rounded-xl border-rose-500 bg-rose-50 text-rose-700 font-bold";
    }

    function setRating(rating) {
      jobs[currentJobIndex].miRating = rating;
      highlightRatingBtn(rating);
      saveDataLocally();
    }

    function updateJobData() {
      if (jobs.length === 0) return;
      const job = jobs[currentJobIndex];
      job.mismatchReason = document.getElementById('focus-mismatch-reason').value;
      job.miComment = document.getElementById('focus-mi-comment').value;
      job.yoComment = document.getElementById('focus-yo-comment').value;
    }

    function navigateJob(delta) {
      updateJobData();
      currentJobIndex = Math.max(0, Math.min(jobs.length - 1, currentJobIndex + delta));
      renderFocusView();
    }

    function renderJobList() {
      const rating = document.getElementById('filter-rating').value;
      const kw = document.getElementById('filter-keyword').value.toLowerCase();
      const tbody = document.getElementById('job-table-body');
      tbody.innerHTML = '';

      const filtered = jobs.filter(j => {
        const matchR = rating === 'ALL' || (rating === 'UNREVIEWED' && !j.miRating) || j.miRating === rating;
        const matchK = (j.company || '').toLowerCase().includes(kw) || (j.title || '').toLowerCase().includes(kw);
        return matchR && matchK;
      });

      document.getElementById('job-count-badge').innerText = `${filtered.length} 件`;

      filtered.forEach(job => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 border-b";
        tr.innerHTML = `
          <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[11px] bg-slate-100">${job.miRating || '未'}</span></td>
          <td class="p-3"><div class="font-bold">${escapeHtml(job.title)}</div><div class="text-slate-500 text-[11px]">${escapeHtml(job.company)}</div></td>
          <td class="p-3">${escapeHtml(job.mismatchReason) || '-'}</td>
          <td class="p-3 max-w-xs truncate">${escapeHtml(job.miComment) || '-'}</td>
          <td class="p-3 max-w-xs truncate">${escapeHtml(job.yoComment) || '-'}</td>
          <td class="p-3 text-center"><button onclick="jumpToJob(${job.id})" class="text-rose-600 font-bold">開く</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function jumpToJob(id) {
      const idx = jobs.findIndex(j => j.id === id);
      if (idx !== -1) {
        currentJobIndex = idx;
        switchView('focus');
      }
    }

    function renderInsights() {
      const liked = jobs.filter(j => j.miRating === '◎' || j.miRating === '◯');
      document.getElementById('insight-likes-list').innerHTML = liked.map(j => `
        <li class="bg-slate-50 p-2 rounded border"><b>${escapeHtml(j.title)}</b>: ${escapeHtml(j.miComment) || 'コメントなし'}</li>
      `).join('') || '<li class="text-slate-400">データがありません</li>';

      const counts = {};
      jobs.filter(j => j.mismatchReason).forEach(j => { counts[j.mismatchReason] = (counts[j.mismatchReason] || 0) + 1; });
      document.getElementById('insight-dislikes-chart').innerHTML = Object.entries(counts).map(([r, c]) => `
        <div class="flex justify-between p-2 bg-slate-50 rounded border"><span>${escapeHtml(r)}</span><b>${c} 件</b></div>
      `).join('') || '<p class="text-slate-400">データがありません</p>';
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function handleAddJob(e) {
      e.preventDefault();
      jobs.push({
        id: Date.now(),
        date: new Date().toISOString().split('T')[0],
        company: document.getElementById('new-company').value,
        title: document.getElementById('new-title').value,
        url: document.getElementById('new-url').value,
        industry: document.getElementById('new-industry').value,
        salary: document.getElementById('new-salary').value,
        location: document.getElementById('new-location').value,
        description: document.getElementById('new-description').value,
        requirements: document.getElementById('new-requirements').value,
        tags: document.getElementById('new-tags').value ? document.getElementById('new-tags').value.split(',').map(s=>s.trim()) : [],
        miRating: "", mismatchReason: "", miComment: "", yoComment: ""
      });
      saveDataLocally();
      closeModal('add-modal');
      currentJobIndex = jobs.length - 1;
      switchView('focus');
    }

    function saveSheetUrl() {
      sheetApiUrl = document.getElementById('sheet-api-url').value.trim();
      localStorage.setItem('yjf_sheet_url', sheetApiUrl);
      checkSheetStatus();
      syncToSpreadsheet();
      closeModal('sheet-modal');
    }

    function checkSheetStatus() {
      document.getElementById('sheet-status-dot').className = sheetApiUrl ? "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" : "w-2.5 h-2.5 rounded-full bg-slate-400";
    }

    function showToast(msg, isSpin = false) {
      const toast = document.getElementById('sync-toast');
      const icon = document.getElementById('sync-toast-icon');
      document.getElementById('sync-toast-msg').innerText = msg;
      icon.className = isSpin ? "fa-solid fa-spinner fa-spin text-rose-400" : "fa-solid fa-check text-emerald-400";
      toast.classList.remove('opacity-0', 'translate-y-2');
      if (!isSpin) {
        setTimeout(() => toast.classList.add('opacity-0', 'translate-y-2'), 2000);
      }
    }

    function syncToSpreadsheetDebounced() {
      if (!sheetApiUrl) return;
      showToast("同期中...", true);
      syncToSpreadsheet();
    }

    function syncToSpreadsheet() {
      if (!sheetApiUrl) return;
      fetch(sheetApiUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(jobs)
      }).then(() => showToast("同期完了"))
        .catch(() => showToast("同期エラー"));
    }

    function fetchFromSheet() {
      if (!sheetApiUrl) return;
      fetch(sheetApiUrl)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            jobs = data;
            saveDataLocally();
            renderFocusView();
            renderJobList();
            renderInsights();
          }
        });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
