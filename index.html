<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoshi Job Finder</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; }
    header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
    header img { max-height: 50px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fff; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

  <header>
    <img src="ロゴ.jpg" alt="ロゴ" onerror="this.style.display='none'">
    <h1>Yoshi Job Finder</h1>
  </header>

  <main>
    <h2>職種の追加</h2>
    <div class="card">
      <form id="jobForm">
        <div class="form-group">
          <label for="title">職種名</label>
          <input type="text" id="title" required placeholder="例: Webエンジニア">
        </div>
        <div class="form-group">
          <label for="department">部署 / カテゴリ</label>
          <input type="text" id="department" placeholder="例: 開発部">
        </div>
        <div class="form-group">
          <label for="location">勤務地</label>
          <input type="text" id="location" placeholder="例: 東京都 / リモート">
        </div>
        <div class="form-group">
          <label for="description">仕事内容・詳細</label>
          <textarea id="description" rows="4"></textarea>
        </div>
        <button type="submit" id="submitBtn">追加する</button>
      </form>
    </div>

    <h2>登録済み職種一覧</h2>
    <div id="jobList">読み込み中...</div>
  </main>

  <script>
    // 指定いただいたGASウェブアプリURLを設定済みです
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzXReNqtJMhByirBBm7W3xkcM1Q166FBfibxw0uPmC3q1RkBJzOORut8lJ_i01xEpoR/exec";

    // データの読み込み
    async function loadJobs() {
      const container = document.getElementById('jobList');
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const data = await res.json();
        
        if (!data || data.length === 0) {
          container.innerHTML = "<p>登録されている職種はありません。</p>";
          return;
        }

        container.innerHTML = data.map(job => `
          <div class="card">
            <h3>${job.title || '（職種名なし）'}</h3>
            <p><strong>部署:</strong> ${job.department || '-'}</p>
            <p><strong>勤務地:</strong> ${job.location || '-'}</p>
            <p>${job.description || ''}</p>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = "<p>データの読み込みに失敗しました。</p>";
      }
    }

    // データの追加送信（上書きを防いで追記する）
    document.getElementById('jobForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "送信中...";

      const payload = {
        title: document.getElementById('title').value,
        department: document.getElementById('department').value,
        location: document.getElementById('location').value,
        description: document.getElementById('description').value
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // GASとのクロスドメイン通信用
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("職種を追加しました！");
        document.getElementById('jobForm').reset();
        setTimeout(loadJobs, 1500); // 反映待ち後に一覧再取得
      } catch (err) {
        alert("送信に失敗しました。");
      } finally {
        btn.disabled = false;
        btn.textContent = "追加する";
      }
    });

    // 初回読み込み
    loadJobs();
  </script>
</body>
</html>
